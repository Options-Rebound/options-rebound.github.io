# Scan the watchlist and publish the site to GitHub Pages.
# Runs every 15 minutes while the US market is open (times are UTC; covers both EST and EDT),
# once after the close, whenever the watchlist or the code changes, and on demand (Actions → Run workflow).
name: Update data and site

on:
  schedule:
    - cron: "*/15 13-20 * * 1-5"
    - cron: "15 21 * * 1-5"
  push:
    branches: [main]
    paths: ["watchlist/**", "site/**", "scanner/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt
      - run: pip install -r scanner/requirements.txt
      - name: Scan the watchlist
        env:
          SITE_URL: https://ftalla18.github.io/options-rebound
        run: python scanner/scan.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
